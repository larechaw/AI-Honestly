<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yellow Bag | Content Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Editor's Note loads from fonts installed on the machine; Cormorant Garamond is the fallback elsewhere */
  @font-face { font-family: 'YB Editors Note'; src: local("Editor'sNote-Regular"), local("Editor's Note Regular"); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'YB Editors Note'; src: local("Editor'sNote-Italic"), local("Editor's Note Italic"); font-weight: 400; font-style: italic; }
  @font-face { font-family: 'YB Editors Note'; src: local("Editor'sNote-Semibold"), local("Editor's Note Semibold"); font-weight: 600; font-style: normal; }

  /* Layout: the Growth Command Center shell (charcoal header, white tab bar, warm page, white cards).
     Single light theme by design, matching the Yellow Bag software family. */
  :root {
    --charcoal: #323232; --gold: #CCA712; --olive: #746B03; --warm-gray: #C5B9AD;
    --cream: #EBE6DF; --black: #000000; --white: #FFFFFF;
    --page: #F6F3EF; --surface: #FFFFFF; --hair: #DDD5CB; --muted: #6E6A63; --zebra: #FAF8F5;
    --display: 'YB Editors Note', 'Cormorant Garamond', Georgia, serif;
    --text: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--black); }
  body { font: 400 14px/1.5 var(--text); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Header and navigation */
  header.top { background: var(--charcoal); color: var(--white); }
  header.top .in { max-width: 1240px; margin: 0 auto; padding: 0 28px; min-height: 58px; display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; }
  .wordmark { font: 400 22px var(--display); letter-spacing: 0.02em; white-space: nowrap; }
  .wordmark b { color: var(--gold); font-weight: 400; }
  .product { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--warm-gray); border-left: 1px solid #5a5a5a; padding-left: 14px; white-space: nowrap; }
  .tabbar { background: var(--surface); border-bottom: 1px solid var(--hair); }
  nav.tabs { max-width: 1240px; margin: 0 auto; padding: 0 28px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs a { text-decoration: none; padding: 14px 14px 12px; font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
  nav.tabs a.on { color: var(--charcoal); border-bottom-color: var(--gold); font-weight: 600; }
  .spacer { flex: 1; }
  .asof { font-size: 11px; letter-spacing: 0.08em; color: var(--warm-gray); text-transform: uppercase; }
  .askbtn { background: transparent; border: 1px solid #5a5a5a; color: var(--white); border-radius: 4px; padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  .askbtn:hover { border-color: var(--gold); }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 28px 64px; }

  /* Demonstration notice */
  .notice { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; background: var(--cream); border-radius: 4px; padding: 9px 14px; font-size: 12px; color: var(--charcoal); margin-bottom: 18px; }
  .notice b { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--olive); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--olive); font-weight: 600; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }

  /* Type */
  h1 { font: 400 34px/1.15 var(--display); margin: 0; color: var(--charcoal); text-wrap: balance; }
  h1 em, h2 em { font-style: italic; }
  h2 { font: 400 22px/1.25 var(--display); margin: 0 0 4px; color: var(--charcoal); text-wrap: balance; }
  h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--charcoal); margin: 0; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--olive); }
  .lede { color: var(--muted); max-width: 760px; margin: 6px 0 0; }
  .small { font-size: 12px; }
  .muted { color: var(--muted); }
  .q { font-size: 10px; font-weight: 600; color: var(--gold); letter-spacing: 0.12em; margin-right: 6px; }
  .num { font-variant-numeric: tabular-nums; }

  /* Layout */
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  @media (max-width: 1100px) { .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 980px) { .g2, .g3, .g4, .g21 { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: 4px; padding: 18px 20px; min-width: 0; }
  .card.cream { background: var(--cream); border-color: transparent; }
  .card > h3 { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .cardhead { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .cardhead h3 { margin: 0; }
  .section { margin-top: 26px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pagehead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .pagehead > div:first-child { min-width: 0; }

  /* Week facts under the page title */
  .facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .facts span b { color: var(--charcoal); font-weight: 600; }

  /* Tiles */
  .tile { background: var(--surface); border: 1px solid var(--hair); border-top: 3px solid var(--gold); border-radius: 4px; padding: 14px 18px; min-width: 0; }
  .tile.quiet { border-top-color: var(--warm-gray); }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font: 600 34px/1.1 var(--text); color: var(--charcoal); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile.quiet .value { color: var(--charcoal); }
  .tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  button.tile { text-align: left; width: 100%; }
  button.tile:hover { border-color: var(--warm-gray); }

  /* Progress */
  .progress { margin-top: 16px; background: var(--surface); border: 1px solid var(--hair); border-radius: 4px; padding: 14px 18px; }
  .progress .line { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; font-size: 13px; color: var(--charcoal); margin-bottom: 10px; }
  .progress .line strong { font-weight: 600; }
  .bar { height: 10px; background: var(--cream); border-radius: 2px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar i.pub { background: var(--olive); }
  .bar i.sch { background: var(--gold); }
  .bar i.dev { background: var(--warm-gray); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .minibar { height: 6px; background: var(--cream); border-radius: 2px; overflow: hidden; min-width: 70px; }
  .minibar i { display: block; height: 100%; background: var(--olive); }

  /* Status labels: label text carries meaning; the mark is secondary */
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; color: var(--charcoal); }
  .st i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .st.pos i { background: var(--olive); }
  .st.att i { background: var(--gold); }
  .st.neg i { background: transparent; border: 2px solid var(--charcoal); }
  .st.neu i { background: var(--warm-gray); }
  .st.dash i { background: transparent; border: 1.5px dashed var(--muted); }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 3px; background: var(--cream); color: var(--charcoal); white-space: nowrap; }
  .chip.sys { background: transparent; border: 1px solid var(--hair); color: var(--muted); font-size: 10px; letter-spacing: 0.04em; }
  .chip.gold { background: var(--gold); color: var(--charcoal); font-weight: 600; }
  .chip.olive { background: var(--cream); color: var(--olive); font-weight: 600; }
  .chip.miss { background: transparent; border: 1px dashed var(--warm-gray); color: var(--muted); }
  .chip.demo { background: transparent; border: 1px solid var(--gold); color: var(--olive); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .flag { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--charcoal); border: 1.5px solid var(--charcoal); border-radius: 3px; padding: 1px 6px; white-space: nowrap; }

  /* Lists */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 10px 0; border-top: 1px solid var(--cream); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
  .list li:first-child { border-top: 0; padding-top: 2px; }
  .list .t { font-weight: 600; font-size: 13px; color: var(--charcoal); }
  .list .d { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
  .list .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .list li.click { cursor: pointer; }
  .list li.click:hover .t { text-decoration: underline; text-underline-offset: 2px; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .more { font-size: 12px; margin-top: 8px; display: inline-block; color: var(--olive); font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; }
  .more:hover { text-decoration: underline; }

  /* Tables */
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--white); background: var(--charcoal); padding: 8px 10px; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--cream); vertical-align: top; }
  tbody tr:nth-child(even) td { background: var(--zebra); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td .sub { font-size: 12px; color: var(--muted); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--cream); }
  td .tt { font-weight: 600; color: var(--charcoal); }
  tfoot td { font-weight: 600; border-top: 2px solid var(--charcoal); border-bottom: 0; }

  /* Controls */
  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 4px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--charcoal); color: var(--white); }
  select, input[type="text"], input[type="date"], input[type="search"], textarea { font: inherit; font-size: 12px; padding: 6px 8px; border: 1px solid var(--hair); border-radius: 4px; background: var(--surface); color: var(--charcoal); max-width: 100%; }
  textarea { font-size: 13px; line-height: 1.55; width: 100%; resize: vertical; padding: 10px 12px; }
  input[type="search"] { min-width: 220px; }
  .btn { border: 1px solid var(--charcoal); background: var(--charcoal); color: var(--white); padding: 8px 14px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--charcoal); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--charcoal); }
  .btn.sm { padding: 4px 10px; font-size: 11px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  label.f { display: grid; gap: 3px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  /* Production pipeline */
  .pipe { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
  .pipe button { background: var(--cream); border: 1px solid transparent; border-radius: 3px; padding: 8px 8px 7px; text-align: left; min-width: 0; }
  .pipe button[aria-pressed="true"] { background: var(--surface); border-color: var(--charcoal); }
  .pipe .sl { font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pipe .n { font: 600 22px/1.2 var(--text); color: var(--charcoal); font-variant-numeric: tabular-nums; }
  .pipe .n.zero { color: var(--warm-gray); }
  @media (max-width: 980px) { .pipe { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  /* Observations */
  .obs { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 16px; font-size: 13px; margin: 0; }
  .obs dt { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--olive); padding-top: 2px; }
  .obs dd { margin: 0; }
  .seen { border-top: 1px solid var(--cream); padding: 14px 0; }
  .seen:first-of-type { border-top: 0; padding-top: 4px; }
  .seen .head { font-weight: 600; font-size: 14px; color: var(--charcoal); margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; }
  @media (max-width: 560px) { .obs { grid-template-columns: 1fr; } }

  /* Week schedule */
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .day { background: var(--zebra); border: 1px solid var(--cream); border-radius: 3px; padding: 8px; min-height: 96px; min-width: 0; }
  .day.today { border-color: var(--gold); background: var(--surface); }
  .day .dh { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .day.today .dh { color: var(--olive); }
  .ent { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--hair); border-left: 3px solid var(--warm-gray); border-radius: 2px; padding: 5px 6px; margin-bottom: 5px; font-size: 11px; line-height: 1.3; color: var(--charcoal); }
  .ent:hover { border-color: var(--charcoal); }
  .ent b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .ent span { color: var(--muted); font-size: 10px; }
  .ent.s-pub { border-left-color: var(--olive); }
  .ent.s-sch, .ent.s-apr { border-left-color: var(--gold); }
  .ent.s-dev { border-left-color: var(--warm-gray); }
  .ent.s-late { border-left-color: var(--charcoal); border-left-style: dotted; border-left-width: 3px; }
  .ent.s-prop { border-style: dashed; border-left: 3px dashed var(--gold); background: var(--zebra); }
  @media (max-width: 860px) { .days { grid-template-columns: 1fr; } .day { min-height: 0; } }

  /* Month and quarter calendars */
  .month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--hair); border-left: 1px solid var(--hair); }
  .month .mh { background: var(--charcoal); color: var(--white); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 8px; }
  .month .mc { border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); min-height: 104px; padding: 6px; background: var(--surface); min-width: 0; }
  .month .mc.out { background: var(--zebra); }
  .month .mc.out .dn { color: var(--warm-gray); }
  .month .mc.today { box-shadow: inset 0 0 0 2px var(--gold); }
  .month .dn { font-size: 11px; font-weight: 600; color: var(--charcoal); margin-bottom: 4px; }
  .calwrap { overflow-x: auto; }
  .calwrap .month { min-width: 760px; }
  .qweeks td { font-size: 12px; }
  .qweeks .ents { display: flex; flex-wrap: wrap; gap: 4px; }
  .qweeks .ent { width: auto; max-width: 260px; margin: 0; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(50, 50, 50, 0.32); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--page); z-index: 41; overflow-y: auto; box-shadow: -8px 0 30px rgba(50, 50, 50, 0.18); padding: calc(18px + env(safe-area-inset-top, 0px)) 24px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .drawer .dtop { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .drawer .close { margin-left: auto; background: transparent; border: 1px solid var(--hair); border-radius: 4px; padding: 5px 10px; font-size: 12px; }
  .drawer .card { margin-top: 12px; }
  .kvg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
  @media (max-width: 560px) { .kvg { grid-template-columns: 1fr; } .drawer { padding-left: 16px; padding-right: 16px; } }
  .kv { font-size: 12px; margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .kv b { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; }
  .kv.miss { color: var(--muted); font-style: italic; }

  /* Sticky Web */
  .webwrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
  @media (max-width: 980px) { .webwrap { grid-template-columns: 1fr; } }
  #cy { height: 620px; background: var(--surface); border: 1px solid var(--hair); border-radius: 4px; position: relative; }
  .webtools { position: absolute; top: 10px; right: 10px; z-index: 5; display: flex; gap: 4px; }
  .webtools button { background: var(--surface); border: 1px solid var(--hair); border-radius: 3px; width: 30px; height: 28px; font-size: 14px; font-weight: 600; color: var(--charcoal); }
  .weblegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .weblegend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; border: 1.5px solid var(--charcoal); }
  .side .card + .card { margin-top: 12px; }
  .nofallback { padding: 24px; color: var(--muted); font-size: 13px; }

  /* Studio */
  .checks section { border: 1px solid var(--hair); border-left: 3px solid var(--charcoal); border-radius: 4px; background: var(--surface); padding: 12px 16px; margin-top: 10px; }
  .checks section.sub { border-left-color: var(--gold); }
  .checks section.opt { border-left-color: var(--warm-gray); }
  .checks section.human { border-left-color: var(--olive); }
  .checks ul { margin: 6px 0 0; padding-left: 18px; }
  .checks li { margin: 6px 0; font-size: 13px; }
  .checks .ref { display: block; font-size: 11px; color: var(--muted); }
  .checklist label { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 12.5px; padding: 5px 0; border-top: 1px solid var(--cream); }
  .checklist label:first-child { border-top: 0; }
  .checklist input { accent-color: var(--olive); margin-top: 2px; }

  /* Proposals */
  .prop { border-top: 1px solid var(--cream); padding: 12px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
  .prop:first-of-type { border-top: 0; }
  .prop input[type="text"] { width: 100%; font-weight: 600; font-size: 13px; }
  .prop .why { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .prop .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .prop.done { opacity: 0.55; }
  @media (max-width: 700px) { .prop { grid-template-columns: 1fr; } .prop .acts { flex-direction: row; flex-wrap: wrap; } }

  /* Assistant */
  .asst { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 32px)); max-height: min(620px, calc(100% - 100px)); background: var(--surface); border: 1px solid var(--hair); border-top: 3px solid var(--gold); border-radius: 4px; box-shadow: 0 10px 34px rgba(50, 50, 50, 0.2); z-index: 35; display: flex; flex-direction: column; }
  .asst .ah { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--cream); }
  .asst .log { overflow-y: auto; padding: 12px 16px; display: grid; gap: 10px; font-size: 13px; }
  .asst .you { justify-self: end; background: var(--cream); padding: 7px 10px; border-radius: 4px; max-width: 85%; }
  .asst .ans { border-left: 2px solid var(--gold); padding-left: 10px; }
  .asst .ans ul { margin: 4px 0 0; padding-left: 16px; }
  .asst form { display: flex; gap: 6px; padding: 10px 16px 14px; border-top: 1px solid var(--cream); }
  .asst form input { flex: 1; font-size: 13px; }
  .sugg { display: flex; flex-wrap: wrap; gap: 6px; }
  .sugg button { background: var(--zebra); border: 1px solid var(--hair); border-radius: 3px; font-size: 11px; padding: 4px 8px; color: var(--charcoal); }

function buildDemo() {

    const a = {
      id: s.id, demo: true, title: s.t, type: s.ty, concept: s.c, secondary: s.sc || [], category: s.cat || '', classification: s.cls || '', situation: s.sit || '',
      campaign: s.camp || '', audience: s.aud || '', purpose: s.msg || '', owner: s.own, status, plan: 'Approved', approval: ['Approved', 'Scheduled', 'Published', 'Needs Update'].includes(status) ? 'Approved' : status === 'Approval Pending' ? 'Pending' : 'Not submitted',

      blocked: s.blk || '', next: s.next || '', placements: s.pl || [], perf: DEMO_PERF[s.id] || null, versions: [], reviews: [],

    else if (status === 'Approved') a.versions.push({ v: '1.0', state: 'Approved', locked: true, date: addDays(s.d, -4), by: 'Founder' });

// Keep demonstration dates current when the page is reopened in a later week
function shiftDemo(state, days) {
  const sh = s => s ? addDays(s, days) : s;
  for (const a of state.assets.filter(a => a.demo)) {
    a.planned = sh(a.planned); a.published = sh(a.published); a.lastReview = sh(a.lastReview); a.nextReview = sh(a.nextReview);
    a.placements.forEach(p => p.d = sh(p.d)); a.versions.forEach(v => v.date = sh(v.date)); a.reviews.forEach(r => r.date = sh(r.date));
  }
  for (const p of state.proposals) p.date = sh(p.date);
  state.anchor = WEEK0;
}

function audit(action, detail) { S.audit.unshift({ at: new Date().toISOString(), by: 'Current user (local)', action, detail }); S.audit = S.audit.slice(0, 200); save(); }

   DERIVED VIEWS (all computed from the records; nothing is stored twice)
   ======================================================================= */
const ASSETS = () => S.mode === 'demo' ? S.assets : S.assets.filter(a => !a.demo);
const LINKS = () => S.mode === 'demo' ? S.links : S.links.filter(l => !l.demo);
const DESTS = () => S.mode === 'demo' ? S.dest : [];
const byId = id => S.assets.find(a => a.id === id) || S.dest.find(d => d.id === id);
const conceptName = id => (S.concepts.find(c => c.id === id) || {}).name || 'Unassigned concept';
const ownerOf = a => a.owner || 'Unassigned';

const isPublished = a => !!a.published && (a.status === 'Published' || a.status === 'Needs Update');
const included = a => a.plan === 'Approved';
const dateOf = a => a.published || a.planned;
const isOverdue = a => included(a) && !isPublished(a) && a.planned && a.planned < TODAY;
const nextAction = a => a.next || (isOverdue(a) && a.status === 'Scheduled' ? 'Confirm publication or reschedule' : NEXT_ACTION[a.status]);
const linksOf = id => LINKS().filter(l => l.from === id || l.to === id);
const other = (l, id) => l.from === id ? l.to : l.from;

const PERIODS = [['week', 'This Week'], ['month', 'This Month'], ['quarter', 'This Quarter'], ['all', 'All Content']];
function periodRange(p) {
  if (p === 'week') return [WEEK0, addDays(WEEK0, 6)];
  if (p === 'month') return [monthStart(TODAY), monthEnd(TODAY)];
  if (p === 'quarter') return [quarterStart(TODAY), quarterEnd(TODAY)];
  return null;
}
const periodLabel = p => { const r = periodRange(p); return r ? `${fmt(r[0])} to ${fmt(r[1], { month: 'short', day: 'numeric', year: 'numeric' })}` : 'All dates'; };
const inRange = (a, r) => !r || between(dateOf(a), r[0], r[1]);

function planInfo() {
  const p = S.plan;
  if (!p || !p.from || !p.to || TODAY < p.from || TODAY > p.to) return null;
  const start = mondayOf(p.from), weeks = Math.floor(diffDays(mondayOf(p.to), start) / 7) + 1;
  return { ...p, week: Math.floor(diffDays(WEEK0, start) / 7) + 1, weeks };
}

function metrics(range) {
  const all = ASSETS().filter(a => inRange(a, range));
  const planned = all.filter(included);
  const published = planned.filter(isPublished);
  const scheduled = planned.filter(a => a.status === 'Scheduled' && !isPublished(a));
  const awaiting = all.filter(a => a.status === 'Approval Pending');
  const pendingProps = S.proposals.filter(p => p.state === 'Proposed' && (!range || between(p.date, range[0], range[1])));
  const dev = planned.filter(a => DEV.includes(a.status));
  const notStarted = planned.filter(a => a.status === 'Planned');
  const placements = all.reduce((n, a) => n + a.placements.filter(p => !range || between(p.d, range[0], range[1])).length, 0);
  const pct = planned.length ? published.length / planned.length * 100 : 0;
  return { all, planned, published, scheduled, awaiting, pendingProps, dev, notStarted, placements, pct, remaining: planned.length - published.length };
}

// Pace: compares what was due by today against what is published
function pace(range) {
  const due = ASSETS().filter(a => included(a) && inRange(a, range) && a.planned && a.planned < TODAY);
  const late = due.filter(a => !isPublished(a));
  const soon = ASSETS().filter(a => included(a) && a.status === 'Approval Pending' && a.planned >= TODAY && diffDays(a.planned, TODAY) <= 3);
  if (!due.length && !soon.length) return { label: 'On Track', cls: 'pos', why: 'Nothing in this period was due before today.' };
  const share = due.length ? late.length / due.length : 0;
  if (!late.length && !soon.length) return { label: 'On Track', cls: 'pos', why: `All ${due.length} pieces due before today are published.` };
  if (late.length <= 1 && share <= 0.15) {
    const parts = [];
    if (late.length) parts.push(`1 of ${due.length} pieces due before today is not published (${late[0].title})`);
    if (soon.length) parts.push(`${plural(soon.length, 'piece')} due within three days still ${soon.length === 1 ? 'needs' : 'need'} approval`);
    return { label: 'At Risk', cls: 'att', why: parts.join('; ') + '.' };
  }
  return { label: 'Behind', cls: 'neg', why: `${late.length} of ${due.length} pieces due before today are not published.` };
}

function coverage(range) {
  const rows = S.concepts.filter(c => c.active).map(c => ({ c, list: ASSETS().filter(a => a.concept === c.id && included(a) && inRange(a, range)) }));
  const orphans = ASSETS().filter(a => included(a) && inRange(a, range) && !S.concepts.some(c => c.active && c.id === a.concept));
  if (orphans.length) rows.push({ c: { id: '', name: 'Unassigned concept', emphasis: 'Needs a primary concept' }, list: orphans });
  return rows.map(({ c, list }) => {
    const pub = list.filter(isPublished).length, sch = list.filter(a => a.status === 'Scheduled' && !isPublished(a)).length;
    const dev = list.filter(a => DEV.includes(a.status)).length, ns = list.filter(a => a.status === 'Planned').length;
    const types = [...new Set(list.map(a => a.type))];
    const missing = ['Blog', 'LinkedIn post', 'Newsletter'].filter(t => !types.includes(t));
    const secondary = ASSETS().filter(a => included(a) && inRange(a, range) && a.secondary.includes(c.id)).length;
    return { c, list, total: list.length, pub, sch, dev, ns, remaining: list.length - pub, pct: list.length ? pub / list.length * 100 : 0, types, missing, secondary, emphasisNow: c.from && between(TODAY, c.from, c.to) && c.id !== 'sa' };
  });
}

// Standard-driven checks on the content network (Content Standard sections cited)
function networkFindings() {
  const out = [];
  const A = ASSETS().filter(included);
  const rel = (id, types, dir) => LINKS().filter(l => types.includes(l.type) && (dir === 'in' ? l.to === id : l.from === id)).map(l => byId(dir === 'in' ? l.from : l.to)).filter(Boolean);
  for (const b of A.filter(a => a.type === 'Blog')) {
    const kids = LINKS().filter(l => l.to === b.id).map(l => byId(l.from)).filter(x => x && x.type);
    const li = kids.filter(k => k.type === 'LinkedIn post');
    const nl = kids.filter(k => k.type === 'Newsletter');
    const rule = CATEGORY_RULES[b.category] || {};
    if (rule.newsletter === 'required' && !nl.length) out.push({ sev: 1, kind: 'Missing newsletter piece', a: b, text: `${b.category} article without its newsletter piece.`, ref: 'Content Standard › Blog Categories › Newsletter Rule', fix: { type: 'Newsletter', rel: 'Supports', date: addDays(b.planned, 1), title: `Subscriber layer: ${b.title}` } });
    if (!li.length) out.push({ sev: 2, kind: 'No LinkedIn release post', a: b, text: 'Article has no native LinkedIn post connected.', ref: 'Content Standard › LinkedIn Integration Rules', fix: { type: 'LinkedIn post', rel: 'Derived from', date: b.planned, title: `Release post: ${b.title}` } });
    const follow = LINKS().some(l => l.to === b.id && l.type === 'Repurposes');
    if (isPublished(b) && !follow && diffDays(TODAY, b.published) >= 7 && diffDays(TODAY, b.published) <= 60) out.push({ sev: diffDays(TODAY, b.published) >= 14 ? 1 : 2, kind: 'Two-week follow-up not planned', a: b, text: `Follow-up LinkedIn post is due ${fmtDay(addDays(b.published, 14))} and is not planned.`, ref: 'Content Standard › LinkedIn Integration Rules › Repurposing', fix: { type: 'LinkedIn post', rel: 'Repurposes', date: addDays(b.published, 14) < TODAY ? TODAY : addDays(b.published, 14), title: `Follow-up: a second angle from "${b.title}"` } });
    if (kids.length === 1 && !isPublished(b)) out.push({ sev: 3, kind: 'Primary article with thin support', a: b, text: `${plural(kids.length, 'supporting piece')} connected.`, ref: 'Content Standard › Blog Distribution' });
  }
  for (const n of A.filter(a => a.type === 'Newsletter')) if (!rel(n.id, ['Supports', 'Derived from', 'References'], 'out').some(x => x.type === 'Blog')) out.push({ sev: 2, kind: 'Newsletter without an article', a: n, text: 'Newsletter piece is not connected to the article it deepens.', ref: 'Content Standard › Newsletter Rules' });
  for (const p of A.filter(a => a.type === 'LinkedIn post' && a.classification !== LI_CLASSES[2])) if (!linksOf(p.id).length) out.push({ sev: 3, kind: 'Unconnected LinkedIn post', a: p, text: 'Post has no relationship to an article or destination.', ref: 'Content Standard › Distribution' });
  return out.sort((x, y) => x.sev - y.sev);
}
// Suggested connections: same primary concept, an unconnected post and a published article
function suggestedLinks() {
  const A = ASSETS().filter(included);
  const out = [];
  for (const p of A.filter(a => a.type === 'LinkedIn post' && !linksOf(a.id).length && a.classification !== LI_CLASSES[2])) {
    const target = A.filter(b => b.type === 'Blog' && b.concept === p.concept && isPublished(b)).sort((x, y) => (y.perf ? y.perf.conv : 0) - (x.perf ? x.perf.conv : 0))[0];
    const key = p.id + '>' + (target && target.id);
    if (target && !S.dismissedLinks.includes(key)) out.push({ key, from: p.id, to: target.id, type: 'Links to', why: `Same primary concept (${conceptName(p.concept)}); the article gives the post a destination.` });
  }
  return out;
}

function perfVerdict(a) {
  const p = a.perf;
  if (a.status === 'Needs Update') return { label: 'Improve', cls: 'att', why: 'Under review; revise before further distribution.' };
  if (!p) return { label: 'Insufficient evidence', cls: 'neu', why: 'No performance data recorded.' };
  const age = a.published ? diffDays(TODAY, a.published) : 0;
  const commercial = (p.conv || 0) + (p.refs || 0);
  const derivatives = LINKS().filter(l => l.to === a.id && ['Repurposes', 'Derived from'].includes(l.type)).length;
  if (age < 14 && !commercial) return { label: 'Insufficient evidence', cls: 'neu', why: `Published ${plural(age, 'day')} ago; too early to judge.` };
  if (commercial >= 1 && a.type === 'Blog' && derivatives < 2) return { label: 'Repurpose', cls: 'pos', why: `${plural(commercial, 'commercial outcome')} with only ${plural(derivatives, 'derivative')}.` };
  if (commercial >= 2 || (commercial >= 1 && p.attr === 'Direct')) return { label: 'Continue or expand', cls: 'pos', why: `${plural(commercial, 'commercial outcome')}, ${p.attr.toLowerCase()} attribution.` };
  if ((p.impr || 0) >= 4000 && !commercial && !(p.replies)) return { label: 'Reposition', cls: 'neg', why: `${(p.impr).toLocaleString()} impressions and no replies or conversations.` };
  if (p.replies && !commercial) return { label: 'Continue', cls: 'neu', why: `${plural(p.replies, 'meaningful reply', 'meaningful replies')}; no conversation yet.` };
  return { label: 'Insufficient evidence', cls: 'neu', why: 'Signals are too thin to act on.' };
}

// "What the Content Engine Sees": at most three observations, grounded in records and the standard
function observations() {
  const out = [];
  const wk = [WEEK0, addDays(WEEK0, 6)];
  const net = networkFindings();
  const nl = net.find(f => f.kind === 'Missing newsletter piece');
  if (nl) out.push({ sev: 1, obs: `"${nl.a.title}" has no newsletter piece.`, why: `${nl.a.category} articles require a deeper subscriber layer the same week. Subscribers lose the reason they opted in, and the article's strongest audience never sees the more candid read.`, act: 'Approve a newsletter piece connected to the article and schedule it for the next send.', ref: nl.ref, go: () => openRecord(nl.a.id) });
  const late = ASSETS().filter(isOverdue);
  const pend = ASSETS().filter(a => included(a) && a.status === 'Approval Pending' && between(a.planned, TODAY, addDays(TODAY, 3)));
  if (late.length || pend.length) out.push({ sev: late.length > 1 ? 1 : 2, obs: [late.length ? `${plural(late.length, 'piece')} past ${late.length === 1 ? 'its' : 'their'} planned date: ${late.map(a => a.title).join('; ')}.` : '', pend.length ? `${plural(pend.length, 'piece')} due within three days still ${pend.length === 1 ? 'awaits' : 'await'} approval.` : ''].filter(Boolean).join(' '), why: 'Late approvals compress editorial review. Rushed pieces are where the IP protection test and evidence checks get skipped.', act: pend.length ? `Founder decision on ${pend.map(a => `"${a.title}"`).join(', ')} today; reschedule anything that cannot clear review rather than publishing it unreviewed.` : 'Clear the review or reschedule; do not publish unreviewed.', ref: 'Content Standard › Role-Based Publishing Responsibilities', go: () => openRecord((pend[0] || late[0]).id) });
  const liWeek = ASSETS().filter(a => included(a) && a.type === 'LinkedIn post' && between(dateOf(a), wk[0], wk[1])).length;
  if (liWeek < 4) out.push({ sev: 2, obs: `${plural(liWeek, 'LinkedIn publication')} planned this week against a minimum of four.`, why: 'The cadence counts reposts and deliberate reintroductions, so the gap can be closed with proven material rather than new filler.', act: 'Reintroduce the best-performing published piece this week instead of writing a new post to fill the slot.', ref: 'Content Standard › Publishing Cadence', go: () => { calState.view = 'week'; go('calendar'); } });
  const strong = ASSETS().filter(a => isPublished(a) && a.type === 'Blog' && perfVerdict(a).label === 'Repurpose');
  if (strong.length) out.push({ sev: 3, obs: `"${strong[0].title}" is producing conversations with little derivative content.`, why: 'Content that already earns discovery conversations is the cheapest place to add reach. The standard prefers refreshing strong material over replacing it.', act: 'Add a second LinkedIn angle and an advisor-facing email that point back to the article.', ref: 'Content Standard › Content Maintenance', go: () => openRecord(strong[0].id) });
  return out.sort((a, b) => a.sev - b.sev).slice(0, 3);
}

  const next7 = ASSETS().filter(a => included(a) && between(dateOf(a), TODAY, addDays(TODAY, 6)) && ['Planned', 'Researching'].includes(a.status));

/* =======================================================================

function horizon(kind) {
  if (kind === 'week') { const s = addDays(WEEK0, 7); return [s, addDays(s, 6), 'next week']; }

}
function proposePlan(kind) {
  const [from, to, label] = horizon(kind);
  const A = ASSETS().filter(included);
  const props = [];
  const add = p => { if (props.length < 16) props.push({ id: 'PR-' + String(++S.seq.prop).padStart(4, '0'), state: 'Proposed', horizon: label, ...p }); };
  const clampDate = d => d < from ? from : d > to ? to : d;
  const weekday = (wk, i) => clampDate(addDays(wk, 1 + (i % 4))); // Tuesday to Friday
  // 1. Network gaps the standard requires (newsletter layer, release post, two-week follow-up).
  //    Past-due gaps belong in the nearest plan only; they are never pushed months out.
  for (const f of networkFindings().filter(f => f.fix)) {
    if (f.fix.date > to) continue;
    if (f.fix.date < from && kind !== 'week') continue;
    const d = f.fix.date < from ? from : f.fix.date;
    add({ title: f.fix.title, concept: f.a.concept, audience: f.a.audience, message: f.a.purpose, type: f.fix.type, channel: f.fix.type === 'Newsletter' ? 'Subscriber newsletter (ActiveCampaign)' : 'LinkedIn · Larecha Wynn', reason: `${f.kind}. ${f.ref}.`, builds: f.a.id, rel: f.fix.rel, date: d, deps: f.fix.type === 'Newsletter' ? 'Article approved; client observations cleared and anonymized' : 'Source article published', research: 'No new research; draws on the approved article', next: 'Assign author and draft', owner: 'Content Owner / Author' });
  }
  // 2. One substantive blog article each month, anchored to the concept in emphasis
  let m = monthStart(from);
  while (m <= to) {
    const me = monthEnd(m);
    if (!A.some(a => a.type === 'Blog' && between(dateOf(a), m, me))) {
      const c = S.concepts.find(c => c.active && c.id !== 'sa' && c.from && between(m, c.from, c.to)) || S.concepts[0];
      const used = new Set(A.filter(a => a.concept === c.id).map(a => a.situation).concat(props.filter(p => p.concept === c.id).map(p => p.situation)));
      const sit = SITUATIONS.find(s => !used.has(s)) || SITUATIONS[0];
      add({ title: `${c.name}: article for "${sit}"`, concept: c.id, audience: 'CFOs and finance executives', message: `Connect ${c.name} to the situation "${sit}".`, type: 'Blog', channel: 'Website (Showit)', category: 'Implementation Intelligence', situation: sit, reason: `No substantive article planned for ${fmt(m, { month: 'long', year: 'numeric' })}. ${c.name} is in emphasis (${c.emphasis}) and has no content yet for this commercial situation. Content Standard › Publishing Cadence; Strategic Concepts.`, builds: '', rel: '', date: weekday(mondayOf(addDays(m, 10)), 0), deps: 'Two respected sources; Founder thesis approval', research: 'Yes: research brief and two respected sources', next: 'Founder confirms thesis; author prepares research brief', owner: 'Founder' });
    }
    m = addMonths(m, 1);
  }
  // 3. Weekly minimums: one Practitioner Principles publication and four LinkedIn publications.
  //    Gaps are closed only with reintroductions of proven pieces, each used once per plan.
  //    Any remaining shortfall is reported, not filled with new filler.
  const proven = A.filter(a => isPublished(a) && a.type === 'LinkedIn post' && ['Continue or expand', 'Continue', 'Repurpose'].includes(perfVerdict(a).label));
  const pp = A.filter(a => a.classification === LI_CLASSES[2] && isPublished(a)).sort((x, y) => x.published < y.published ? -1 : 1);
  const used = new Set();
  const shortfall = [];
  for (let wk = dow(from) === 0 ? from : addDays(mondayOf(from), 7); wk <= to; wk = addDays(wk, 7)) {
    const we = addDays(wk, 6);
    const liCount = () => A.filter(a => a.type === 'LinkedIn post' && between(dateOf(a), wk, we)).length + props.filter(p => p.type === 'LinkedIn post' && between(p.date, wk, we)).length;
    const hasPP = A.some(a => a.classification === LI_CLASSES[2] && between(dateOf(a), wk, we)) || props.some(p => p.classification === LI_CLASSES[2] && between(p.date, wk, we));
    if (!hasPP) {
      const q = quarterStart(wk);
      const src = pp.find(x => !used.has(x.id) && quarterStart(x.published) === q);
      const anyThisQuarter = A.some(a => a.classification === LI_CLASSES[2] && quarterStart(dateOf(a)) === q) || props.some(p => p.classification === LI_CLASSES[2] && quarterStart(p.date) === q);
      if (!src && !anyThisQuarter) {
        const c = S.concepts.find(c => c.active && c.id !== 'sa' && c.from && between(wk, c.from, c.to)) || S.concepts[0];
        add({ title: `Practitioner Principles, Q${quarterOf(wk)} ${wk.slice(0, 4)}, part 1: why the principle exists`, concept: c.id, audience: 'Practitioners and finance systems professionals', message: `Introduce the quarter's bounded principle drawn from ${c.name}.`, type: 'LinkedIn post', channel: 'LinkedIn · Larecha Wynn', classification: LI_CLASSES[2], reason: `Each quarter features one professional principle in four original publications. The ${c.name} principle is assigned and its application is still to be finalized. Content Standard › Practitioner Principles › Approved Quarterly Assignments.`, builds: '', rel: '', date: weekday(wk, 1), deps: 'Founder selects and bounds the principle; graphic and terminology agreed', research: 'Yes: define the bounded principle', next: 'Founder decision on the principle', owner: 'Founder' });
      }
      if (src) { used.add(src.id); add({ title: `Reintroduce: ${src.title}`, concept: src.concept, audience: src.audience, message: src.purpose, type: 'LinkedIn post', channel: 'LinkedIn · Larecha Wynn', classification: LI_CLASSES[2], reason: 'No Practitioner Principles publication this week. Each original appears about three times across the quarter. Content Standard › Practitioner Principles › Quarterly Structure.', builds: src.id, rel: 'Repurposes', date: weekday(wk, 1), deps: 'None', research: 'No; fresh framing of approved material', next: 'Write a fresh introduction for the repost', owner: 'Publishing Coordinator' }); }
    }
    let n = liCount();
    while (n < 4) {
      const src = proven.find(x => !used.has(x.id));
      if (!src) break;
      used.add(src.id);
      add({ title: `Reintroduce: ${src.title}`, concept: src.concept, audience: src.audience, message: src.purpose, type: 'LinkedIn post', channel: 'LinkedIn · Larecha Wynn', reason: `Week of ${fmt(wk)} has ${plural(n, 'LinkedIn publication')} against a minimum of four. Reuses a piece with recorded replies or conversations. Content Standard › Publishing Cadence.`, builds: src.id, rel: 'Repurposes', date: weekday(wk, n), deps: 'None', research: 'No', next: 'Draft a new opening that reframes the original insight', owner: 'Publishing Coordinator' });
      n = liCount();
    }
    if (n < 4) shortfall.push([wk, 4 - n]);
  }
  props.sort((x, y) => x.date < y.date ? -1 : 1);
  // Respect capacity: keep proposals within the configured weekly capacity
  const cap = +S.plan.capacity;
  if (!cap) return { label, from, to, items: props, shortfall };
  const kept = [];
  for (const p of props) {
    const ws = mondayOf(p.date);
    const load = A.filter(a => !isPublished(a) && between(dateOf(a), ws, addDays(ws, 6))).length + kept.filter(k => mondayOf(k.date) === ws).length;
    if (load < cap) kept.push(p); else { p.state = 'Deferred'; p.reason += ` Deferred: week of ${fmt(ws)} is at the capacity of ${cap}.`; kept.push(p); }
  }
  return { label, from, to, items: kept, shortfall };
}
