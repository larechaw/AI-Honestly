<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yellow Bag Stillness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed canvas garden (raked sand, stones, enso, gold sphere); brand header top, breath cue and controls anchored bottom. Single evening look. */
:root {
  --charcoal: #323232;
  --gold: #CCA712;
  --olive: #746B03;
  --warm-gray: #C5B9AD;
  --cream: #EBE6DF;
  --ink: rgba(50, 50, 50, 0.72);
  --line: rgba(197, 185, 173, 0.22);
  --font-head: "Editor's Note", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--charcoal);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#garden { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.shell {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-inline: max(16px, 4vw);
  padding-block: max(18px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.shell > * { pointer-events: auto; }

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wordmark {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gold);
  text-decoration: none;
}
.wordmark:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }
.tagline {
  font-family: var(--font-head);
  font-style: italic;
  font-size: 16px;
  color: var(--warm-gray);
}
.session {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--warm-gray);
  font-variant-numeric: tabular-nums;
  text-align: right;
  display: grid;
  gap: 4px;
}
.session b { color: var(--cream); font-weight: 500; }

footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
}
.cue {
  font-family: var(--font-head);
  font-weight: 500;
  font-size: clamp(34px, 5.2vw, 56px);
  line-height: 1;
  color: var(--cream);
  margin: 0;
  text-wrap: balance;
  transition: opacity 0.6s ease;
}
.count {
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  min-height: 1em;
}
.reflection {
  font-family: var(--font-head);
  font-style: italic;
  font-size: clamp(17px, 2vw, 21px);
  color: var(--warm-gray);
  max-width: 38ch;
  min-height: 2.6em;
  margin: 0;
  text-wrap: balance;
  transition: opacity 1.4s ease;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 6px;
}
.pattern {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  background: var(--ink);
  backdrop-filter: blur(6px);
}
.pattern button, .btn {
  font: 500 11px/1 var(--font-body);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--warm-gray);
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 10px 14px;
  cursor: pointer;
  transition: color 0.3s, background 0.3s;
}
.pattern button:hover, .btn:hover { color: var(--cream); }
.pattern button[aria-pressed="true"] { background: var(--gold); color: var(--charcoal); }
.btn {
  border: 1px solid var(--line);
  background: var(--ink);
  backdrop-filter: blur(6px);
  padding: 11px 18px;
}
.btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
button:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }

@media (max-width: 520px) {
  .session { text-align: left; }
  .pattern button { padding: 9px 10px; letter-spacing: 0.1em; }
  .btn { padding: 10px 14px; }
}
</style>
</head>
<body>
<canvas id="garden" aria-hidden="true"></canvas>

<div class="shell">
  <header>
    <div class="brand">
      <a class="wordmark" href="https://www.yellowbag.tech" target="_blank" rel="noopener">Yellow Bag</a>
      <span class="tagline">Systems That Serve Strategy.</span>
    </div>
    <div class="session" aria-live="off">
      <span>Session <b id="clock">00:00</b></span>
      <span>Breaths <b id="breaths">0</b></span>
    </div>
  </header>

  <footer>
    <p class="cue" id="cue" aria-live="polite">Breathe in</p>
    <div class="count" id="count">4</div>
    <p class="reflection" id="reflection">The close will still be there in one minute.</p>
    <div class="controls">
      <div class="pattern" role="group" aria-label="Breathing pattern">
        <button type="button" id="p-box" data-pattern="box" aria-pressed="true">Box 4-4-4-4</button>
        <button type="button" id="p-478" data-pattern="478" aria-pressed="false">Calm 4-7-8</button>
        <button type="button" id="p-even" data-pattern="even" aria-pressed="false">Even 5-5</button>
      </div>
      <button type="button" class="btn" id="pause" aria-pressed="false">Pause</button>
      <button type="button" class="btn" id="sound" aria-pressed="false">Sound off</button>
    </div>
  </footer>
</div>

<script>
(() => {
  const C = {
    charcoal: [50, 50, 50],
    gold: [204, 167, 18],
    olive: [116, 107, 3],
    warm: [197, 185, 173],
    cream: [235, 230, 223]
  };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Breathing engine ---------- */
  const PATTERNS = {
    box:  [['Breathe in', 4], ['Hold', 4], ['Breathe out', 4], ['Rest', 4]],
    478:  [['Breathe in', 4], ['Hold', 7], ['Breathe out', 8]],
    even: [['Breathe in', 5], ['Breathe out', 5]]
  };
  const REFLECTIONS = [
    'The close will still be there in one minute.',
    'Materiality applies to worry, too.',
    'Variance is information, not a verdict.',
    'Decide from stillness. Urgency is not a strategy.',
    'A clear forecast starts with a clear head.',
    'One unhurried decision outweighs ten reactive ones.',
    'The ledger balances in time. So does the breath.',
    'Rest is a control. Treat it like one.'
  ];

  let pattern = PATTERNS.box;
  let phaseIdx = 0, phaseT = 0, breath = 0, paused = false;
  let sessionSec = 0, breathCount = 0, reflectionIdx = 0;

  const $ = id => document.getElementById(id);
  const cueEl = $('cue'), countEl = $('count'), reflEl = $('reflection');
  const clockEl = $('clock'), breathsEl = $('breaths');

  const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * t);

  function setCue() {
    cueEl.textContent = paused ? 'Paused' : pattern[phaseIdx][0];
  }
  function nextReflection() {
    reflectionIdx = (reflectionIdx + 1) % REFLECTIONS.length;
    reflEl.style.opacity = 0;
    setTimeout(() => { reflEl.textContent = REFLECTIONS[reflectionIdx]; reflEl.style.opacity = 1; }, 1400);
  }
  function enterPhase(i) {
    phaseIdx = i; phaseT = 0;
    const label = pattern[i][0];
    if (label === 'Breathe out') spawnRipple();
    if (i === 0 && sessionSec > 1) {
      breathCount++;
      breathsEl.textContent = breathCount;
      if (breathCount % 2 === 0) nextReflection();
    }
    setCue();
  }
  function stepBreath(dt) {
    if (paused) return;
    sessionSec += dt;
    phaseT += dt;
    const [label, dur] = pattern[phaseIdx];
    if (phaseT >= dur) { enterPhase((phaseIdx + 1) % pattern.length); return stepBreath(0); }
    const p = phaseT / dur;
    if (label === 'Breathe in') breath = ease(p);
    else if (label === 'Breathe out') breath = 1 - ease(p);
    else if (label === 'Hold') breath = 1;
    else breath = 0;
    countEl.textContent = Math.ceil(dur - phaseT);
    const m = Math.floor(sessionSec / 60), s = Math.floor(sessionSec % 60);
    clockEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  document.querySelectorAll('.pattern button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pattern button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      pattern = PATTERNS[btn.dataset.pattern];
      enterPhase(0);
    });
  });
  const pauseBtn = $('pause');
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    pauseBtn.setAttribute('aria-pressed', String(paused));
    setCue();
  }
  pauseBtn.addEventListener('click', togglePause);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); togglePause(); }
  });

  /* ---------- Sound: a low drone that swells with the breath ---------- */
  let audio = null;
  const soundBtn = $('sound');
  soundBtn.addEventListener('click', () => {
    try {
      if (!audio) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const master = ctx.createGain(); master.gain.value = 0;
        const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 900;
        filter.connect(master); master.connect(ctx.destination);
        [98, 146.83, 196, 293.66].forEach((f, i) => {
          const o = ctx.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine';
          o.frequency.value = f; o.detune.value = (i - 1.5) * 3;
          const g = ctx.createGain(); g.gain.value = [0.5, 0.25, 0.35, 0.12][i];
          o.connect(g); g.connect(filter); o.start();
        });
        audio = { ctx, master, filter, on: false };
      }
      audio.on = !audio.on;
      if (audio.on) audio.ctx.resume();
      soundBtn.textContent = audio.on ? 'Sound on' : 'Sound off';
      soundBtn.setAttribute('aria-pressed', String(audio.on));
    } catch (err) {
      soundBtn.textContent = 'Sound unavailable';
      soundBtn.disabled = true;
    }
  });
  function stepAudio() {
    if (!audio) return;
    const t = audio.ctx.currentTime;
    const target = audio.on && !paused ? 0.035 + breath * 0.05 : 0;
    audio.master.gain.setTargetAtTime(target, t, 0.25);
    audio.filter.frequency.setTargetAtTime(500 + breath * 900, t, 0.3);
  }

  /* ---------- Canvas garden ---------- */
  const canvas = $('garden');
  const ctx = canvas.getContext('2d');
  const bg = document.createElement('canvas');
  const bgx = bg.getContext('2d');
  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0;
  let stones = [];

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = bg.width = Math.round(W * DPR);
    canvas.height = bg.height = Math.round(H * DPR);
    cx = W / 2;
    cy = H * (W < 520 ? 0.42 : 0.43);
    R = Math.max(70, Math.min(W * 0.26, H * 0.18));
    stones = [
      { x: W * (W < 520 ? 0.14 : 0.16), y: H * 0.78, rx: R * 0.30, ry: R * 0.17, rings: 4 },
      { x: W * (W < 520 ? 0.88 : 0.84), y: H * 0.24, rx: R * 0.20, ry: R * 0.12, rings: 3 },
      { x: W * (W < 520 ? 0.80 : 0.87), y: H * 0.30, rx: R * 0.11, ry: R * 0.07, rings: 0 }
    ];
    drawSand();
  }

  // Raked sand: parallel lines that part around the central rock, concentric rings around it and the stones.
  function drawSand() {
    const g = bgx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.fillStyle = rgba(C.charcoal, 1);
    g.fillRect(0, 0, W, H);

    const warmPool = g.createRadialGradient(cx, cy, R * 0.5, cx, cy, Math.max(W, H) * 0.75);
    warmPool.addColorStop(0, rgba(C.olive, 0.16));
    warmPool.addColorStop(0.45, rgba(C.olive, 0.04));
    warmPool.addColorStop(1, rgba(C.charcoal, 0));
    g.fillStyle = warmPool; g.fillRect(0, 0, W, H);

    const gap = Math.max(9, R * 0.075);
    const ringOuter = R * 2.15;
    const zones = [{ x: cx, y: cy, r: ringOuter }].concat(
      stones.filter(s => s.rings).map(s => ({ x: s.x, y: s.y, r: s.rx + gap * (s.rings + 0.5) }))
    );

    // Parallel rake lines, clipped away from ring zones and nudged around them.
    g.save();
    g.beginPath();
    g.rect(0, 0, W, H);
    zones.forEach(z => { g.moveTo(z.x + z.r + gap * 0.6, z.y); g.ellipse(z.x, z.y, z.r + gap * 0.6, (z.r + gap * 0.6) * 0.62, 0, 0, Math.PI * 2, true); });
    g.clip('evenodd');
    g.lineWidth = 1;
    let row = 0;
    for (let y0 = -gap * 4; y0 < H + gap * 4; y0 += gap, row++) {
      g.beginPath();
      for (let x = -10; x <= W + 10; x += 6) {
        let y = y0 + Math.sin(x * 0.006 + row * 0.35) * 1.4;
        zones.forEach(z => {
          const dx = x - z.x, dy = (y0 - z.y) / 0.62;
          const d = Math.hypot(dx, dy);
          const push = Math.exp(-Math.pow((d - z.r) / (z.r * 0.9), 2));
          y += Math.sign(y0 - z.y || 1) * push * gap * 1.4;
        });
        x === -10 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.strokeStyle = rgba(C.warm, row % 2 ? 0.075 : 0.05);
      g.stroke();
    }
    g.restore();

    // Concentric rings around the central rock.
    for (let r = R * 1.62, i = 0; r <= ringOuter; r += gap, i++) {
      g.beginPath();
      for (let a = 0; a <= Math.PI * 2 + 0.05; a += 0.04) {
        const rr = r + Math.sin(a * 3 + i) * 0.9;
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 0.62;
        a === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.strokeStyle = rgba(C.warm, 0.09 - i * 0.006);
      g.stroke();
    }

    // Stones and their rings.
    stones.forEach(s => {
      for (let k = 1; k <= s.rings; k++) {
        g.beginPath();
        g.ellipse(s.x, s.y, s.rx + gap * k, (s.rx + gap * k) * 0.62, 0, 0, Math.PI * 2);
        g.strokeStyle = rgba(C.warm, 0.085 - k * 0.012);
        g.stroke();
      }
      g.save();
      g.beginPath();
      g.ellipse(s.x, s.y + s.ry * 0.5, s.rx * 1.08, s.ry * 0.7, 0, 0, Math.PI * 2);
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.filter = 'blur(6px)'; g.fill();
      g.restore();
      const sg = g.createRadialGradient(s.x - s.rx * 0.3, s.y - s.ry * 0.6, 1, s.x, s.y, s.rx * 1.1);
      sg.addColorStop(0, rgba(C.warm, 0.35));
      sg.addColorStop(0.35, rgba(C.charcoal, 1));
      sg.addColorStop(1, 'rgba(18,18,18,1)');
      g.beginPath();
      g.ellipse(s.x, s.y, s.rx, s.ry, -0.08, 0, Math.PI * 2);
      g.fillStyle = sg; g.fill();
    });

    const vig = g.createRadialGradient(cx, cy, Math.min(W, H) * 0.35, cx, cy, Math.hypot(W, H) * 0.62);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.5)');
    g.fillStyle = vig; g.fillRect(0, 0, W, H);
  }

  // Fibonacci sphere of points.
  const N = 1400;
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const th = golden * i;
    pts.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r, lat: Math.asin(y), seed: Math.random() });
  }

  // Drifting gold motes.
  const motes = Array.from({ length: 46 }, () => ({
    x: Math.random(), y: Math.random(), s: 0.4 + Math.random() * 1.3,
    v: 0.004 + Math.random() * 0.01, ph: Math.random() * Math.PI * 2
  }));

  const ripples = [];
  function spawnRipple() { ripples.push({ r: R * 1.05, a: 0.4 }); }

  // Enso: a single brushed circle with a gap, stroked in many short segments.
  function drawEnso(t, scale) {
    const rBase = R * 1.38 * scale;
    const start = -1.9 + t * 0.03;
    const sweep = Math.PI * 2 * 0.92;
    const steps = 220;
    const wMax = Math.max(3, R * 0.055);
    ctx.lineCap = 'round';
    for (let i = 0; i < steps; i++) {
      const u = i / steps;
      const a0 = start + sweep * u, a1 = start + sweep * (u + 1 / steps);
      const taper = Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.15)), 0.6) * (1 - u * 0.55);
      const wob = Math.sin(u * 17 + 1.3) * 0.012 + Math.sin(u * 5.3) * 0.018;
      const r0 = rBase * (1 + wob);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0);
      ctx.lineTo(cx + Math.cos(a1) * r0, cy + Math.sin(a1) * r0);
      ctx.lineWidth = 0.6 + wMax * taper;
      ctx.strokeStyle = rgba(C.gold, 0.18 + 0.4 * taper);
      ctx.stroke();
    }
  }

  function drawSphere(t, scale) {
    const rs = R * scale;
    const glow = ctx.createRadialGradient(cx, cy, rs * 0.2, cx, cy, rs * 2.1);
    glow.addColorStop(0, rgba(C.gold, 0.16 + breath * 0.14));
    glow.addColorStop(0.5, rgba(C.gold, 0.04 + breath * 0.04));
    glow.addColorStop(1, rgba(C.gold, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(cx - rs * 2.2, cy - rs * 2.2, rs * 4.4, rs * 4.4);

    const rotY = t * 0.16, tilt = 0.38 + Math.sin(t * 0.05) * 0.06;
    const cyR = Math.cos(rotY), syR = Math.sin(rotY), cT = Math.cos(tilt), sT = Math.sin(tilt);
    const back = [], front = [];
    for (const p of pts) {
      const wave = 1 + Math.sin(p.lat * 7 - t * 0.9) * 0.018 * (0.4 + breath);
      let x = p.x * wave, y = p.y * wave, z = p.z * wave;
      const x1 = x * cyR + z * syR, z1 = -x * syR + z * cyR;
      const y2 = y * cT - z1 * sT, z2 = y * sT + z1 * cT;
      const persp = 1.9 / (2.9 - z2);
      const item = [cx + x1 * rs * persp, cy + y2 * rs * persp, z2, p.seed];
      (z2 < 0 ? back : front).push(item);
    }
    const dot = (arr) => {
      for (const [x, y, z, seed] of arr) {
        const depth = (z + 1) / 2;
        const size = (0.45 + depth * 1.35) * Math.max(0.8, R / 150);
        let col = z < 0 ? C.olive : C.gold;
        let a = 0.12 + depth * 0.8;
        if (z > 0.55 && seed > 0.93) { col = C.cream; a = 0.55 + 0.45 * Math.sin(t * 1.3 + seed * 40) ** 2; }
        ctx.fillStyle = rgba(col, a);
        ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
      }
    };
    dot(back);
    // A faint equator ring, like a ledger rule, tying the dots together.
    ctx.beginPath();
    ctx.ellipse(cx, cy, rs * 1.0, rs * Math.abs(sT) * 1.0, 0, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(C.gold, 0.12); ctx.lineWidth = 1; ctx.stroke();
    dot(front);
  }

  function drawMist(t) {
    for (let i = 0; i < 2; i++) {
      const mx = W * (0.3 + 0.4 * i) + Math.sin(t * 0.03 + i * 2) * W * 0.18;
      const my = H * (0.25 + 0.5 * i) + Math.cos(t * 0.025 + i) * H * 0.08;
      const mr = Math.max(W, H) * 0.45;
      const m = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
      m.addColorStop(0, rgba(C.cream, 0.035));
      m.addColorStop(1, rgba(C.cream, 0));
      ctx.fillStyle = m; ctx.fillRect(0, 0, W, H);
    }
  }

  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    stepBreath(dt);
    stepAudio();
    t += reduceMotion ? dt * 0.25 : dt;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);
    drawMist(t);

    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += dt * R * 0.32; rp.a -= dt * 0.055;
      if (rp.a <= 0) { ripples.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.ellipse(cx, cy, rp.r * 1.25, rp.r * 1.25 * 0.62, 0, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(C.gold, rp.a * 0.5); ctx.lineWidth = 1.2; ctx.stroke();
    }

    for (const m of motes) {
      if (!reduceMotion) { m.y -= m.v * dt * 0.6; m.x += Math.sin(t * 0.3 + m.ph) * 0.00008; }
      if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); }
      const tw = 0.25 + 0.5 * Math.sin(t * 0.8 + m.ph) ** 2;
      ctx.fillStyle = rgba(C.gold, tw * 0.6);
      ctx.beginPath(); ctx.arc(m.x * W, m.y * H, m.s, 0, Math.PI * 2); ctx.fill();
    }

    const scale = 0.84 + breath * 0.16;
    drawEnso(t, 0.94 + breath * 0.06);
    drawSphere(t, scale);

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', layout);
  layout();
  enterPhase(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
